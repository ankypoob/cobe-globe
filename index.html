<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cobe Globe</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌍</text></svg>" />
  </head>
  <body>
    <div id="app">
      <header class="overlay top">
        <p class="kicker">Interactive globe</p>
        <h1>Cobe</h1>
        <p class="hint">Drag to rotate · Auto-rotates when idle</p>
      </header>

      <div class="stage">
        <div class="glow" aria-hidden="true"></div>
        <canvas id="globe" aria-label="Interactive 3D globe"></canvas>
      </div>

      <footer class="overlay bottom">
        <p>
          Built with
          <a href="https://github.com/shuding/cobe" target="_blank" rel="noreferrer">cobe</a>
          · Inspired by
          <a href="https://github.com/fayazara/cobe-swift" target="_blank" rel="noreferrer">cobe-swift</a>
        </p>
      </footer>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
